version: '3.8'

services:
  flask:
    build: .
    container_name: flask_calculator
    environment:
      - FLASK_ENV=production
      - DOMAIN=${DOMAIN:-localhost}
      - PORT=8000
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
    networks:
      - calculator-net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
    depends_on:
      - flask
    networks:
      - calculator-net

networks:
  calculator-net:
    driver: bridge
