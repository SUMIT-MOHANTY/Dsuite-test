<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Simple Calculator</h3>
                    </div>
                    <div class="card-body">
                        <form id="calculatorForm">
                            <div class="mb-3">
                                <label for="num1" class="form-label">First Number</label>
                                <input type="number" class="form-control" id="num1" name="num1" step="any" required>
                            </div>
                            <div class="mb-3">
                                <label for="num2" class="form-label">Second Number</label>
                                <input type="number" class="form-control" id="num2" name="num2" step="any" required>
                            </div>
                            <div class="mb-3">
                                <label for="operation" class="form-label">Operation</label>
                                <select class="form-select" id="operation" name="operation" required>
                                    <option value="add">Addition (+)</option>
                                    <option value="subtract">Subtraction (-)</option>
                                    <option value="multiply">Multiplication (×)</option>
                                    <option value="divide">Division (÷)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Calculate</button>
                        </form>
                        <div id="result" class="mt-3" style="display: none;">
                            <h4>Result: <span id="result-value" class="text-success"></span></h4>
                        </div>
                        <div id="error" class="mt-3 alert alert-danger" style="display: none;">
                            <span id="error-message"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
