<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    
    <!-- Bootstrap 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">
                <div class="card calculator-card mt-5">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0 text-center">Simple Calculator</h3>
                    </div>
                    <div class="card-body">
                        <form id="calculator-form" action="/calculate" method="POST" enctype="application/x-www-form-urlencoded">
                            <div class="mb-3">
                                <label for="num1" class="form-label">First Number</label>
                                <input type="number" step="any" class="form-control" id="num1" name="num1" placeholder="Enter first number" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="num2" class="form-label">Second Number</label>
                                <input type="number" step="any" class="form-control" id="num2" name="num2" placeholder="Enter second number" required>
                            </div>
                            
                            <div class="btn-group-calc d-flex justify-content-center flex-wrap gap-2">
                                <button type="submit" class="btn btn-primary" name="operation" value="add">Add</button>
                                <button type="submit" class="btn btn-primary" name="operation" value="subtract">Subtract</button>
                                <button type="submit" class="btn btn-primary" name="operation" value="multiply">Multiply</button>
                                <button type="submit" class="btn btn-primary" name="operation" value="divide">Divide</button>
                            </div>
                        </form>
                        
                        <div id="result" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 CDN JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
