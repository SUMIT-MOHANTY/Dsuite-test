<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main role="main" class="container py-5">
        <h1 class="text-center mb-4">Calculator</h1>
        
        <form id="calculator-form" class="mx-auto" style="max-width: 500px;">
            <div class="mb-3">
                <label for="num1-input" class="form-label">First Number</label>
                <input type="number" step="any" class="form-control" id="num1-input" name="num1" aria-required="true" required>
            </div>
            
            <div class="mb-3">
                <label for="operation-select" class="form-label">Operation</label>
                <select class="form-select" id="operation-select" name="operation" aria-required="true" required>
                    <option value="add">Add (+)</option>
                    <option value="subtract">Subtract (-)</option>
                    <option value="multiply">Multiply (×)</option>
                    <option value="divide">Divide (÷)</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="num2-input" class="form-label">Second Number</label>
                <input type="number" step="any" class="form-control" id="num2-input" name="num2" aria-required="true" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100" aria-label="Calculate">
                Calculate
                <svg aria-hidden="true" width="16" height="16" fill="currentColor" class="bi bi-calculator ms-2">
                    <path d="M12 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                    <path d="M4 2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5v-2zm0 4a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-1zM8 8a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-1zm0 4a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-1zM4 12a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-1z"/>
                </svg>
            </button>
            
            <div id="result-container" class="mt-4 text-center" aria-live="polite">
                <span id="result" class="h3"></span>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
