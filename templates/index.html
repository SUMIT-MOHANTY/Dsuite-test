<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSL Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">SSL Secure Calculator</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="calc-form">
                    <div class="mb-3">
                        <label for="num1" class="form-label">First Number</label>
                        <input type="number" step="any" class="form-control" id="num1" name="num1" required>
                    </div>
                    <div class="mb-3">
                        <label for="num2" class="form-label">Second Number</label>
                        <input type="number" step="any" class="form-control" id="num2" name="num2" required>
                    </div>
                    <div class="mb-3">
                        <label for="operation" class="form-label">Operation</label>
                        <select class="form-select" id="operation" name="operation" required>
                            <option value="add">Add (+)</option>
                            <option value="subtract">Subtract (-)</option>
                            <option value="multiply">Multiply (×)</option>
                            <option value="divide">Divide (÷)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Calculate</button>
                </form>
                <div id="result" class="mt-3 alert alert-primary" style="display: none;"></div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/calculator.js"></script>
</body>
</html>
