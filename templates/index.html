<!DOCTYPE html>
<html>
<head>
    <title>Optimized Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">Optimized Calculator</h2>
                <form id="calculatorForm" class="mt-4">
                    <div class="mb-3">
                        <label>Number 1:</label>
                        <input type="number" step="any" class="form-control" name="num1" required>
                    </div>
                    <div class="mb-3">
                        <label>Number 2:</label>
                        <input type="number" step="any" class="form-control" name="num2" required>
                    </div>
                    <div class="mb-3">
                        <label>Operation:</label>
                        <select class="form-control" name="operation" required>
                            <option value="add">Add</option>
                            <option value="subtract">Subtract</option>
                            <option value="multiply">Multiply</option>
                            <option value="divide">Divide</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Calculate</button>
                </form>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
